version = 0.1

[default.global.parameters]
stack_name = "cloudvault"
region = "ap-south-1"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "cloudvault"
region = "ap-south-1"
disable_rollback = true
parameter_overrides = "ProjectName=\"cloudvault\" AllowedOrigin=\"http://localhost:5173\" MaxFileSizeMB=\"25\" MaxObjectCount=\"100\" MaxStorageMB=\"250\" PresignedUrlExpirySeconds=\"300\" LogRetentionDays=\"7\" DemoRetentionDays=\"30\""
image_repositories = []
