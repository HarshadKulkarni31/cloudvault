AWSTemplateFormatVersion: "2010-09-09"

Transform: AWS::Serverless-2016-10-31

Description: >
  CloudVault — Near-Zero-Cost Serverless Cloud File Vault
  Private S3 bucket + Lambda + API Gateway HTTP API + Cognito Google Auth
  (no EC2, RDS, NAT, DynamoDB)

# CAPABILITY_NAMED_IAM is required because this template creates a named IAM role.
# Deploy with: sam deploy --capabilities CAPABILITY_NAMED_IAM
# Or use the samconfig.toml in this directory which sets it automatically.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Storage Guardrails"
        Parameters:
          - MaxFileSizeMB
          - MaxObjectCount
          - MaxStorageMB
          - DemoRetentionDays

      - Label:
          default: "API & Security"
        Parameters:
          - AllowedOrigins
          - PresignedUrlExpirySeconds

      - Label:
          default: "Authentication"
        Parameters:
          - GoogleClientId
          - GoogleClientSecret
          - CognitoDomainPrefix

      - Label:
          default: "Observability"
        Parameters:
          - LogRetentionDays

# ─────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────

Parameters:
  ProjectName:
    Type: String
    Default: cloudvault
    Description: Short project name used in resource naming

  AllowedOrigins:
    Type: String
    Default: "http://localhost:5173,https://d3d8v2xqjcvjs2.cloudfront.net"
    Description: >
      Comma-separated frontend origins allowed by CORS.

  MaxFileSizeMB:
    Type: Number
    Default: 25
    Description: Maximum allowed file size in megabytes

  MaxObjectCount:
    Type: Number
    Default: 100
    Description: Maximum number of objects allowed per user in the uploads prefix

  MaxStorageMB:
    Type: Number
    Default: 250
    Description: Maximum total storage in megabytes per user

  PresignedUrlExpirySeconds:
    Type: Number
    Default: 300
    Description: Presigned URL lifetime in seconds (5 minutes)

  LogRetentionDays:
    Type: Number
    Default: 7
    Description: CloudWatch log retention in days (keep short to minimise cost)

  DemoRetentionDays:
    Type: Number
    Default: 30
    MinValue: 0
    MaxValue: 90
    Description: >
      Optional S3 lifecycle expiration for objects (0–90 days).
      Set to 0 to disable automatic expiration.

  # ── Authentication Parameters ──────────────────────────

  GoogleClientId:
    Type: String
    Description: >
      Google OAuth 2.0 Client ID from Google Cloud Console.
      Required for Google Sign-In via Cognito.
    NoEcho: false

  GoogleClientSecret:
    Type: String
    Description: >
      Google OAuth 2.0 Client Secret from Google Cloud Console.
      Stored securely in Cognito — never exposed to the frontend.
    NoEcho: true

  CognitoDomainPrefix:
    Type: String
    Default: cloudvault-auth
    Description: >
      Globally unique prefix for the Cognito Hosted UI domain.
      Your Hosted UI will be at:
      https://<prefix>.auth.<region>.amazoncognito.com
      Must be lowercase letters, numbers, and hyphens only.

# ─────────────────────────────────────────────
# Globals — apply to all Lambda functions
# ─────────────────────────────────────────────

Globals:
  Function:
    Runtime: nodejs20.x

    Architectures:
      - arm64

    MemorySize: 256

    Timeout: 15

    Environment:
      Variables:
        BUCKET_NAME: !Ref CloudVaultBucket
        MAX_FILE_SIZE_MB: !Ref MaxFileSizeMB
        MAX_OBJECT_COUNT: !Ref MaxObjectCount
        MAX_STORAGE_MB: !Ref MaxStorageMB
        PRESIGNED_URL_EXPIRY: !Ref PresignedUrlExpirySeconds
        UPLOADS_PREFIX: "uploads/"
        ALLOWED_ORIGIN: !Select [0, !Ref AllowedOrigins]
        NODE_OPTIONS: "--enable-source-maps"

# ─────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────

Resources:
  # ── S3 Bucket ─────────────────────────────

  CloudVaultBucket:
    Type: AWS::S3::Bucket

    Properties:
      BucketName: !Sub "${ProjectName}-${AWS::AccountId}-${AWS::Region}"

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      VersioningConfiguration:
        Status: Suspended

      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

          - Id: DemoObjectExpiration
            Status: !If
              - DemoExpirationEnabled
              - Enabled
              - Disabled
            Prefix: "uploads/"
            ExpirationInDays: !If
              - DemoExpirationEnabled
              - !Ref DemoRetentionDays
              - 1

      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"

            AllowedMethods:
              - GET
              - PUT
              - HEAD

            AllowedOrigins: !Split [",", !Ref AllowedOrigins]

            ExposedHeaders:
              - ETag

            MaxAge: 3000

  # ── Cognito User Pool ──────────────────────

  CloudVaultUserPool:
    Type: AWS::Cognito::UserPool

    Properties:
      UserPoolName: !Sub "${ProjectName}-user-pool"

      # Google is the only sign-in method
      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      # Keep the existing schema attributes
      #     /*Schema:
      #       - Name: email
      #          AttributeDataType: String
      #          Mutable: true
      #          Required: true
      #
      #        - Name: name
      #          AttributeDataType: String
      #          Mutable: true
      #          Required: false

      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false

      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false

  # ── Google Identity Provider ───────────────

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider

    Properties:
      UserPoolId: !Ref CloudVaultUserPool

      ProviderName: Google

      ProviderType: Google

      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "email openid profile"

      AttributeMapping:
        email: email
        name: name
        username: sub

  # ── Cognito App Client ─────────────────────

  CloudVaultUserPoolClient:
    Type: AWS::Cognito::UserPoolClient

    DependsOn:
      - GoogleIdentityProvider

    Properties:
      ClientName: !Sub "${ProjectName}-web-client"

      UserPoolId: !Ref CloudVaultUserPool

      GenerateSecret: false

      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30

      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

      SupportedIdentityProviders:
        - Google

      AllowedOAuthFlows:
        - code

      AllowedOAuthScopes:
        - email
        - openid
        - profile

      AllowedOAuthFlowsUserPoolClient: true

      CallbackURLs:
        - https://d3d8v2xqjcvjs2.cloudfront.net/callback
        - http://localhost:5173/callback

      LogoutURLs:
        - https://d3d8v2xqjcvjs2.cloudfront.net/
        - http://localhost:5173

      PreventUserExistenceErrors: ENABLED

      EnableTokenRevocation: true

  # ── Cognito Hosted UI Domain ───────────────

  CloudVaultUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain

    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref CloudVaultUserPool

  # ── IAM Role for Lambda ────────────────────

  CloudVaultLambdaRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub "${ProjectName}-lambda-role"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service: lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: CloudVaultS3LeastPrivilege

          PolicyDocument:
            Version: "2012-10-17"

            Statement:
              - Sid: AllowListBucket

                Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:
                  - !GetAtt CloudVaultBucket.Arn

                Condition:
                  StringLike:
                    s3:prefix:
                      - "uploads/*"
                      - "uploads/"

              - Sid: AllowObjectOperations

                Effect: Allow

                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject

                Resource:
                  - !Sub "${CloudVaultBucket.Arn}/uploads/*"

  # ── API Gateway HTTP API ───────────────────

  CloudVaultApi:
    Type: AWS::Serverless::HttpApi

    Properties:
      StageName: v1

      # JWT Authorizer — validates Cognito ID tokens automatically
      Auth:
        DefaultAuthorizer: CognitoAuthorizer

        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"

            JwtConfiguration:
              issuer: !Sub
                - "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}"
                - UserPoolId: !Ref CloudVaultUserPool

              audience:
                - !Ref CloudVaultUserPoolClient

      # Only one AllowOrigin entry.
      # AllowedOrigin already defaults to http://localhost:5173.
      CorsConfiguration:
        AllowOrigins: !Split [",", !Ref AllowedOrigins]

        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS

        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With

        MaxAge: 600

  # ── Lambda Functions ───────────────────────

  HealthFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName: !Sub "${ProjectName}-health"
      CodeUri: ../backend/
      Handler: src/handlers/health.handler
      Role: !GetAtt CloudVaultLambdaRole.Arn

      Events:
        HealthApi:
          Type: HttpApi

          Properties:
            ApiId: !Ref CloudVaultApi
            Path: /health
            Method: GET

            # Health endpoint is public
            Auth:
              Authorizer: NONE

  ListFilesFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName: !Sub "${ProjectName}-list-files"
      CodeUri: ../backend/
      Handler: src/handlers/listFiles.handler
      Role: !GetAtt CloudVaultLambdaRole.Arn

      Events:
        ListFilesApi:
          Type: HttpApi

          Properties:
            ApiId: !Ref CloudVaultApi
            Path: /files
            Method: GET

  CreateUploadUrlFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName: !Sub "${ProjectName}-create-upload-url"
      CodeUri: ../backend/
      Handler: src/handlers/createUploadUrl.handler
      Role: !GetAtt CloudVaultLambdaRole.Arn

      Events:
        CreateUploadUrlApi:
          Type: HttpApi

          Properties:
            ApiId: !Ref CloudVaultApi
            Path: /upload-url
            Method: POST

  CreateDownloadUrlFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName: !Sub "${ProjectName}-create-download-url"
      CodeUri: ../backend/
      Handler: src/handlers/createDownloadUrl.handler
      Role: !GetAtt CloudVaultLambdaRole.Arn

      Events:
        CreateDownloadUrlApi:
          Type: HttpApi

          Properties:
            ApiId: !Ref CloudVaultApi
            Path: /download-url
            Method: GET

  DeleteFileFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName: !Sub "${ProjectName}-delete-file"
      CodeUri: ../backend/
      Handler: src/handlers/deleteFile.handler
      Role: !GetAtt CloudVaultLambdaRole.Arn

      Events:
        DeleteFileApi:
          Type: HttpApi

          Properties:
            ApiId: !Ref CloudVaultApi
            Path: /files/{key+}
            Method: DELETE

  # ── CloudWatch Log Groups ──────────────────

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup

    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-health"
      RetentionInDays: !Ref LogRetentionDays

  ListFilesFunctionLogGroup:
    Type: AWS::Logs::LogGroup

    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-list-files"
      RetentionInDays: !Ref LogRetentionDays

  CreateUploadUrlFunctionLogGroup:
    Type: AWS::Logs::LogGroup

    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-create-upload-url"
      RetentionInDays: !Ref LogRetentionDays

  CreateDownloadUrlFunctionLogGroup:
    Type: AWS::Logs::LogGroup

    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-create-download-url"
      RetentionInDays: !Ref LogRetentionDays

  DeleteFileFunctionLogGroup:
    Type: AWS::Logs::LogGroup

    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-delete-file"
      RetentionInDays: !Ref LogRetentionDays

# ─────────────────────────────────────────────
# Conditions
# ─────────────────────────────────────────────

Conditions:
  DemoExpirationEnabled: !Not
    - !Equals
      - !Ref DemoRetentionDays
      - 0

# ─────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────

Outputs:
  ApiBaseUrl:
    Description: "API Gateway HTTP API base URL — set as VITE_API_URL in frontend/.env"
    Value: !Sub "https://${CloudVaultApi}.execute-api.${AWS::Region}.amazonaws.com/v1"

  BucketName:
    Description: "S3 bucket name"
    Value: !Ref CloudVaultBucket

  BucketArn:
    Description: "S3 bucket ARN"
    Value: !GetAtt CloudVaultBucket.Arn

  LambdaRoleArn:
    Description: "Lambda execution role ARN"
    Value: !GetAtt CloudVaultLambdaRole.Arn

  # ── Auth Outputs ───────────────────────────

  CognitoUserPoolId:
    Description: "Cognito User Pool ID — set as VITE_COGNITO_USER_POOL_ID in frontend/.env"
    Value: !Ref CloudVaultUserPool

  CognitoClientId:
    Description: "Cognito App Client ID — set as VITE_COGNITO_CLIENT_ID in frontend/.env"
    Value: !Ref CloudVaultUserPoolClient

  CognitoHostedUiDomain:
    Description: "Cognito Hosted UI base domain — set as VITE_COGNITO_DOMAIN in frontend/.env"
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"

  GoogleRedirectUriForConsole:
    Description: "Add this URI to your Google Cloud Console OAuth 2.0 client's Authorized redirect URIs"
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
