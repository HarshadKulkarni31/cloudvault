<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CloudVault — Secure serverless file vault powered by AWS S3" />
    <title>CloudVault</title>
    <link rel="icon" type="image/svg+xml" href="/vault-icon.svg" />
  </head>
  <body class="bg-gray-50">
    <script>
      (() => {
        const mode = localStorage.getItem('cloudvault-theme') || 'system';
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle(
          'dark',
          mode === 'dark' || (mode === 'system' && systemDark),
        );
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
